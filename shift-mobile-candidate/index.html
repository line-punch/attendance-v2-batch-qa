<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手機多段打卡測試</title>
<style>body{font:18px/1.6 system-ui;margin:0;padding:18px;background:#eff4f5;color:#243644}main{max-width:480px;margin:auto}section{background:white;padding:22px;border-radius:18px;margin:16px 0}h1{font-size:24px}select,button{font:inherit;min-height:56px;width:100%;border-radius:10px;padding:12px}select{border:1px solid #6a7d85;background:white}button{border:0;color:white;background:#316951;box-shadow:0 4px #204b39;cursor:pointer}button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px #204b39}button:disabled{opacity:.55;cursor:not-allowed}.actions{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}.actions .midshift{background:#2b6289;box-shadow:0 4px #20465f}.actions .midshift:active:not(:disabled){box-shadow:0 1px #20465f}small{display:block;color:#586b78}#status{padding:16px;background:#fff3d6;border-radius:12px}[hidden]{display:none!important}</style>
<main><h1>手機多段打卡測試</h1><p id="status" role="status" aria-live="polite">尚未連接隔離登入服務，不能送出。</p>
<section><button id="login" disabled>確認測試登入</button><small>只使用 TEST001／TEST_CO。只會寫入隔離測試表。</small></section>
<section><h2>上下班打卡</h2><div id="shiftBox" hidden><label for="shift">今天上班班別</label><select id="shift"><option value="">請選擇主管通知的班別</option><option value="STANDARD">正常班 08:30～17:30</option><option value="EARLY">早班 07:30～16:30</option></select><small>下班沿用上班時保存的班別，不能重新選班。</small></div><p id="savedShift"></p><div class="actions"><button id="clockIn" disabled>上班</button><button id="clockLeave" class="midshift" disabled>中途離開</button><button id="clockOut" disabled>下班</button><button id="clockReturn" class="midshift" disabled>中途返回</button></div><button id="confirmMissingClock" hidden disabled>確認漏打，記錄本次打卡</button></section>
<section><button id="refresh" disabled>重新整理當月紀錄</button><div id="records"></div></section></main>
<script src="../V2_ShiftClientState_CANDIDATE.js?v=multi20261118"></script><script src="./config.js"></script><script src="./transport.js?v=multi20261118"></script><script src="./app.js?v=multi20261118rules"></script></html>
